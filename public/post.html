<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章 - 老土日记</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

    <!-- ===== 顶部导航（请替换为你 index.html 中的相同结构以保持一致） ===== -->
    <header>
        <div class="container">
            <div class="logo"><a href="/">老土日记</a></div>
            <nav>
                <ul>
                    <li><a href="/">全部</a></li>
                    <li><a href="/?category=诗歌">诗歌</a></li>
                    <li><a href="/?sort=latest">最新</a></li>
                </ul>
            </nav>
            <div class="menu-toggle" id="menuToggle">☰</div>
        </div>
    </header>

    <!-- ===== 侧边栏（移动端抽屉，请替换为你 index.html 中的相同结构） ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="widget">
            <h3>归档</h3>
            <ul>
                <li><a href="/?archive=2026-08">2026年8月</a></li>
                <!-- 更多归档项可动态生成或静态添加 -->
            </ul>
        </div>
        <div class="widget">
            <h3>标签</h3>
            <ul>
                <li><a href="/?tag=诗歌">诗歌</a></li>
                <li><a href="/?tag=日记">日记</a></li>
            </ul>
        </div>
        <div class="widget">
            <h3>链接</h3>
            <ul>
                <li><a href="#">友情链接</a></li>
            </ul>
        </div>
    </aside>

    <!-- ===== 主内容区域 ===== -->
    <main>
        <div class="post-container">
            <h1 id="post-title"></h1>
            <h2 id="post-subtitle"></h2>
            <div id="post-date"></div>
            <div id="post-body"></div>
        </div>
    </main>

    <!-- ===== 页脚 ===== -->
    <footer>
        <p>&copy; 2006-<span id="currentYear"></span> 老土日记</p>
    </footer>

    <!-- ===== JavaScript ===== -->
    <script>
        // 1. 页脚年份自动更新
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // 2. 移动端侧边栏开关（与首页交互一致）
        const toggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        if (toggle && sidebar) {
            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (sidebar.classList.contains('open') &&
                    !sidebar.contains(e.target) &&
                    e.target !== toggle) {
                    sidebar.classList.remove('open');
                }
            });
        }

        // 3. 加载文章内容
        const path = window.location.pathname;          // 例如 /post/hello-world
        const slug = path.split('/').pop();            // 得到 hello-world

        if (slug) {
            fetch(`/api/posts/${slug}`)
                .then(res => {
                    if (!res.ok) throw new Error('文章不存在');
                    return res.json();
                })
                .then(post => {
                    document.title = post.title + ' - 老土日记';
                    document.getElementById('post-title').textContent = post.title;

                    const subtitleEl = document.getElementById('post-subtitle');
                    if (post.subtitle) {
                        subtitleEl.textContent = post.subtitle;
                        subtitleEl.style.display = 'block';
                    } else {
                        subtitleEl.style.display = 'none';
                    }

                    document.getElementById('post-date').textContent =
                        new Date(post.created_at).toLocaleDateString('zh-CN');
                    document.getElementById('post-body').innerHTML = post.content;
                })
                .catch(err => {
                    document.getElementById('post-body').innerHTML =
                        '<p style="color:red;">文章加载失败，请稍后再试。</p>';
                    console.error(err);
                });
        } else {
            document.getElementById('post-body').innerHTML = '<p>未指定文章。</p>';
        }
    </script>
</body>
</html>
