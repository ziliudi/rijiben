<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理后台</title>
  <!-- Google Fonts 加载 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Quill 核心样式 -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <style>
    /* 自定义字体对应的 CSS 类 */
    .ql-font-NotoSerifSC {
      font-family: 'Noto Serif SC', serif;
    }
    .ql-font-Roboto {
      font-family: 'Roboto', sans-serif;
    }
    .ql-font-OpenSans {
      font-family: 'Open Sans', sans-serif;
    }
  </style>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>📝 博客管理</h1>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="newPost()">＋ 新建文章</button>
      <button class="btn btn-success" onclick="loadPosts()">⟳ 刷新列表</button>
      <button class="btn btn-danger" onclick="logout()">退出登录</button>
    </div>

    <div id="post-list-admin"></div>

    <div class="editor-area" id="editorArea" style="display:none;">
      <h2 id="editorTitle">新建文章</h2>
      <div class="form-group"><label>标题</label><input type="text" id="editTitle" /></div>
      <div class="form-group"><label>副标题</label><input type="text" id="editSubtitle" /></div>
      <div class="form-group"><label>Slug</label><input type="text" id="editSlug" placeholder="url-friendly" /></div>
      <div class="form-group"><label>分类</label><input type="text" id="editCategory" value="随笔" /></div>
      <div class="form-group"><label>标签</label><input type="text" id="editTags" placeholder="用逗号分隔" /></div>
      <div class="form-group"><label>发布时间</label><input type="datetime-local" id="editCreatedAt" /></div>
      <div class="form-group">
        <label>状态</label>
        <select id="editStatus">
          <option value="draft">草稿</option>
          <option value="published">发布</option>
        </select>
      </div>
      <div id="editor"></div>
      <div class="editor-actions">
        <button class="btn btn-success" onclick="savePost()">💾 保存</button>
        <button class="btn btn-warning" onclick="cancelEdit()">取消</button>
      </div>
    </div>
  </div>

  <script src="/guanli/dashboard.js"></script>
</body>
</html>
