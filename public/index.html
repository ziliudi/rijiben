<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>老土日记</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <header>
        <div class="container">
            <div class="logo"><a href="/">老土日记</a></div>
            <nav>
                <ul>
                    <li><a href="/" data-view="all">全部</a></li>
                    <li><a href="/?category=诗歌" data-view="category" data-category="诗歌">诗歌</a></li>
                    <li><a href="/?sort=latest" data-view="latest">最新</a></li>
                </ul>
            </nav>
            <div class="menu-toggle" id="menuToggle">☰</div>
        </div>
    </header>

    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="widget">
            <h3>归档</h3>
            <ul id="archiveList">
                <!-- 由 JS 动态生成 -->
            </ul>
        </div>
        <div class="widget">
            <h3>标签</h3>
            <ul id="tagList">
                <!-- 由 JS 动态生成 -->
            </ul>
        </div>
        <div class="widget">
            <h3>链接</h3>
            <ul>
                <li><a href="#">友情链接</a></li>
            </ul>
        </div>
    </aside>

    <!-- ===== 主内容区 ===== -->
    <main>
        <div id="postsContainer">
            <!-- 文章列表由 JS 渲染 -->
        </div>
        <div id="pagination">
            <!-- 分页由 JS 渲染 -->
        </div>
    </main>

    <!-- ===== 页脚 ===== -->
    <footer>
        <p>&copy; 2006-<span id="currentYear"></span> 老土日记</p>
    </footer>

    <!-- ===== JavaScript ===== -->
    <script>
        // 1. 页脚年份
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // 2. 侧边栏开关（移动端）
        const toggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        if (toggle && sidebar) {
            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (sidebar.classList.contains('open') &&
                    !sidebar.contains(e.target) &&
                    e.target !== toggle) {
                    sidebar.classList.remove('open');
                }
            });
        }

        // ===== 全局状态 =====
        let currentPage = 1;
        const perPage = 10;
        let currentCategory = null;
        let currentSort = null;

        // 从 URL 读取参数
        function parseURL() {
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category');
            const sort = params.get('sort');
            const page = parseInt(params.get('page')) || 1;
            return { category, sort, page };
        }

        // ===== 获取文章列表 =====
        function fetchPosts(page = 1, category = null, sort = null) {
            const params = new URLSearchParams();
            params.set('status', 'published');
            params.set('page', page);
            params.set('limit', perPage);
            if (category) params.set('category', category);
            if (sort === 'latest') params.set('sort', 'latest'); // 后端需支持 sort，目前仅按发布时间倒序，可忽略

            const url = `/api/posts?${params.toString()}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    // data 结构: { posts: [], total, page, limit, totalPages }
                    const posts = data.posts || [];
                    const total = data.total || 0;
                    const totalPages = data.totalPages || 0;
                    renderPosts(posts);
                    renderPagination(page, totalPages);
                    // 更新 URL 参数（不刷新页面）
                    const query = new URLSearchParams();
                    if (category) query.set('category', category);
                    if (sort) query.set('sort', sort);
                    if (page > 1) query.set('page', page);
                    const newUrl = window.location.pathname + (query.toString() ? '?' + query.toString() : '');
                    window.history.replaceState({}, '', newUrl);
                })
                .catch(err => {
                    console.error('加载文章失败:', err);
                    document.getElementById('postsContainer').innerHTML = '<p>加载失败，请刷新</p>';
                });
        }

        // ===== 渲染文章列表 =====
        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p>没有文章</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                const date = post.publish_date || post.created_at;
                const dateStr = date ? new Date(date).toLocaleDateString('zh-CN') : '';
                html += `
                    <article>
                        <h2><a href="/post/${post.slug || post.id}">${post.title}</a></h2>
                        <div class="meta">
                            <span>${dateStr}</span>
                            ${post.category ? `<span class="category">${post.category}</span>` : ''}
                            ${post.tags ? `<span class="tags">${post.tags}</span>` : ''}
                        </div>
                        <div class="summary">${post.content ? post.content.substring(0, 200) + '...' : ''}</div>
                        <a href="/post/${post.slug || post.id}" class="read-more">全文</a>
                    </article>
                `;
            });
            container.innerHTML = html;
        }

        // ===== 渲染分页 =====
        function renderPagination(current, totalPages) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = '<div class="pagination">';
            for (let i = 1; i <= totalPages; i++) {
                html += `<a href="#" data-page="${i}" class="${i === current ? 'active' : ''}">${i}</a>`;
            }
            html += '</div>';
            container.innerHTML = html;

            // 点击分页事件
            container.querySelectorAll('a[data-page]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = parseInt(this.dataset.page);
                    if (page !== currentPage) {
                        currentPage = page;
                        fetchPosts(page, currentCategory, currentSort);
                    }
                });
            });
        }

        // ===== 菜单点击切换 =====
        document.querySelectorAll('nav a[data-view]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const view = this.dataset.view;
                let category = null;
                let sort = null;
                if (view === 'category') {
                    category = this.dataset.category;
                } else if (view === 'latest') {
                    sort = 'latest';
                }
                currentCategory = category;
                currentSort = sort;
                currentPage = 1;
                fetchPosts(1, category, sort);
            });
        });

        // ===== 初始化 =====
        function init() {
            const { category, sort, page } = parseURL();
            currentCategory = category || null;
            currentSort = sort || null;
            currentPage = page || 1;
            // 高亮菜单
            document.querySelectorAll('nav a[data-view]').forEach(link => {
                link.classList.remove('active');
                if (category && link.dataset.view === 'category' && link.dataset.category === category) {
                    link.classList.add('active');
                } else if (sort === 'latest' && link.dataset.view === 'latest') {
                    link.classList.add('active');
                } else if (!category && !sort && link.dataset.view === 'all') {
                    link.classList.add('active');
                }
            });
            fetchPosts(currentPage, currentCategory, currentSort);
        }

        init();
    </script>
</body>
</html>
